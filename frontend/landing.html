<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Money</title>
    <style>
      :root {
        --bg: #07111f;
        --panel: #0d1b2d;
        --panel-2: #122741;
        --primary: #56d9d1;
        --primary-2: #8ea8ff;
        --text: #edf8ff;
        --muted: #b9c9da;
        --line: rgba(255,255,255,0.12);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: radial-gradient(circle at top, rgba(86,217,209,0.2), transparent 25%), linear-gradient(180deg, #08121d, #101b2b 60%, #0d1726);
        color: var(--text);
      }
      .wrap {
        width: min(92vw, 760px);
        padding: 40px 28px;
        border-radius: 28px;
        border: 1px solid var(--line);
        background: rgba(13, 27, 45, 0.8);
        box-shadow: 0 20px 50px rgba(0,0,0,0.28);
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--primary);
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: 12px;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.05;
      }
      p {
        margin: 16px 0 28px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 18px;
      }
      .primary, .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 180px;
        padding: 16px 22px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }
      .primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #08131c;
      }
      .secondary {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.03);
        color: var(--text);
      }
      .primary:hover, .secondary:hover {
        transform: translateY(-1px);
      }
      .meta {
        margin-top: 24px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .meta strong { color: var(--text); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">Doctor Money</p>
      <h1>Kelola uangmu lebih cerdas.</h1>
      <p>
        Catat transaksi, pantau anggaran, lihat ringkasan finansial, dan akses bot Telegram untuk mengelola keuangan Anda dari satu tempat.
      </p>
      <div class="actions">
        <a class="primary" href="{{TELEGRAM_LINK}}">Buka di Telegram</a>
        <a class="secondary" href="/dashboard">Lihat Dashboard</a>
      </div>
      <div class="meta">
        <strong>Bot:</strong> Doctor Money • <strong>Data:</strong> sinkron antar dashboard dan Telegram
      </div>
    </main>
  </body>
</html>
