<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin Doctor Money</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --page:#050716; --sky:#0D3248; --mid:#0A1232; --deep:#0B1B40;
  --fg:#EAF2FF; --muted:#A3B3CC; --faint:#71829E;
  --accent:#4FE3E6; --accent-ink:#04222A;
  --good:#6EE7A0; --warn:#FFC857; --bad:#FF7A8A;
  --line:rgba(255,255,255,.14);
  --display:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button,input{touch-action:manipulation}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,var(--sky) 0%,var(--mid) 46%,var(--deep) 100%) fixed;color:var(--fg);font:400 14px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 18px var(--display)}
.brand img{flex:none;width:34px;height:34px;border-radius:11px;object-fit:cover}
.brand b{color:var(--accent);font-weight:600}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.105),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 32px rgba(0,0,12,.28)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font:600 24px/1.2 var(--display);letter-spacing:-.01em}
h2{margin:0;font:600 16px var(--display)}
.aside{margin:0;font-size:12.5px;color:var(--muted)}
.field{width:100%;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--fg);font-size:16px}
.field::placeholder{color:var(--faint)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.btn{height:40px;padding:0 14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--fg);font:600 13.5px var(--body);cursor:pointer;white-space:nowrap;transition:transform .15s cubic-bezier(.2,.8,.3,1),background .2s,opacity .2s}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary:hover{background:linear-gradient(145deg,#97F7F8,#3CC6E4)}
.btn.danger:hover{background:rgba(255,122,138,.12)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(145deg,#7CF3F5,#2FB8D6);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,122,138,.4)}
.btn.armed{background:rgba(255,122,138,.2)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.rows{display:flex;flex-direction:column;gap:10px}
.row{padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;transition:background .2s}
.row:hover{background:rgba(255,255,255,.07)}
.who{min-width:0;flex:1 1 220px}
.who b{display:block;font:600 14.5px var(--body);overflow-wrap:anywhere}
.who span,.aside{font-variant-numeric:tabular-nums}
.who span{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.who .tag{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:999px;font:600 11.5px var(--body);border:1px solid var(--line);color:var(--muted)}
.who .tag.pro{color:var(--accent-ink);background:var(--accent);border-color:transparent}
.who .tag.trial{color:var(--warn);border-color:rgba(255,200,87,.45)}
.empty{padding:16px 8px;text-align:center;color:var(--muted)}
.skel{height:64px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.04) 70%) 0 0/300% 100%;animation:skel 1.4s linear infinite}
.skel:nth-child(2){opacity:.6}
@keyframes skel{to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.err{margin:0;color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:12px 16px;border-radius:14px;background:rgba(18,28,62,.96);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,12,.5);font-weight:600}
.login{max-width:420px;margin:12vh auto 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand"><img src="/icons/icon-192.png" width="34" height="34" alt=""><span>Doctor<b>Money</b> Admin</span></span>
    <button type="button" class="btn" id="logout" hidden>Keluar</button>
  </header>

  <form class="glass panel login" id="login">
    <h1>Masuk admin</h1>
    <p class="aside">Masukkan nilai <b>PRO_ADMIN_SECRET</b> dari Railway. Nilainya hanya disimpan di tab ini dan hilang saat tab ditutup.</p>
    <input class="field" id="secret" type="password" autocomplete="off" placeholder="Secret admin" aria-label="Secret admin" required>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button type="submit" class="btn primary" id="loginBtn">Masuk</button>
  </form>

  <main id="app" hidden>
    <div class="wrap" style="padding:0">
      <section class="glass panel" aria-labelledby="h-pending">
        <div class="panel-h"><h2 id="h-pending">Menunggu persetujuan</h2><button type="button" class="btn" id="refresh">Muat ulang</button></div>
        <div class="rows" id="pending" aria-busy="true"><div class="skel"></div></div>
      </section>
      <section class="glass panel" aria-labelledby="h-users">
        <div class="panel-h"><h2 id="h-users">Pengguna</h2><span class="aside" id="total"></span></div>
        <input class="field" id="q" type="search" placeholder="Cari email, nomor WhatsApp, ID akun, atau ID Telegram" aria-label="Cari pengguna">
        <p class="aside">Satu klik pada tombol paket langsung memberi Pro. Jika akun masih punya masa aktif, durasinya ditambahkan di belakangnya.</p>
        <div class="rows" id="users" aria-busy="true"><div class="skel"></div><div class="skel"></div></div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var API=location.hostname==='localhost'||location.hostname==='127.0.0.1'?'':'https://doctor-money-production.up.railway.app';
var KEY='doctor-money:admin';
var PLANS=[['monthly','+1 bulan'],['six_months','+6 bulan'],['annual','+1 tahun']];
var secret='',users=[],armed=null,searchTimer=null,toastTimer=null;
try{secret=sessionStorage.getItem(KEY)||'';}catch(e){}

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rp(n){return 'Rp '+Math.round(n).toLocaleString('id-ID');}
function date(v){return v?new Date(v).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—';}
function toast(text){var t=$('toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3200);}
function api(path,options){
  options=options||{};options.headers={Authorization:'Bearer '+secret,'Content-Type':'application/json'};
  return fetch(API+path,options).then(function(response){
    return response.json().catch(function(){return {};}).then(function(body){
      if(response.status===401){signOut('Secret admin salah.');throw new Error('Secret admin salah.');}
      if(!response.ok)throw new Error(body.detail||'Permintaan gagal ('+response.status+')');
      return body;
    });
  });
}
function signOut(message){
  secret='';try{sessionStorage.removeItem(KEY);}catch(e){}
  $('app').hidden=true;$('logout').hidden=true;$('login').hidden=false;$('secret').value='';
  $('loginErr').textContent=message||'';$('loginErr').hidden=!message;
}
function tag(u){
  if(u.tier==='pro')return '<span class="tag pro">Pro'+(u.plan?' · '+esc(u.plan):'')+' · sampai '+date(u.ends_at)+'</span>';
  if(u.tier==='trial')return '<span class="tag trial">Uji coba · sampai '+date(u.ends_at)+'</span>';
  return '<span class="tag">Gratis</span>';
}
function userRow(u){
  var contact=[u.telegram_id?'Telegram '+u.telegram_id:'',u.whatsapp_number?'WA +'+esc(u.whatsapp_number):''].filter(Boolean).join(' · ');
  return '<div class="row"><div class="who"><b>'+esc(u.email||'Tanpa email')+'</b><span>'+esc(u.name)+' · akun #'+u.id+' · bergabung '+date(u.created_at)+(contact?' · '+contact:'')+'</span>'+tag(u)+'</div><div class="acts">'+
    PLANS.map(function(p){return '<button type="button" class="btn primary" data-grant="'+p[0]+'" data-id="'+u.id+'">'+p[1]+'</button>';}).join('')+
    (u.tier==='free'?'':'<button type="button" class="btn danger'+(armed===u.id?' armed':'')+'" data-revoke="'+u.id+'">'+(armed===u.id?'Yakin cabut?':'Cabut')+'</button>')+'</div></div>';
}
function renderUsers(){$('users').removeAttribute('aria-busy');$('users').innerHTML=users.length?users.map(userRow).join(''):'<div class="empty">Tidak ada akun yang cocok.</div>';}
function loadUsers(){
  return api('/api/admin/accounts?q='+encodeURIComponent($('q').value.trim())).then(function(body){
    users=body.accounts;$('total').textContent=body.total+' akun terdaftar'+(users.length===50?' · menampilkan 50 terbaru':'');renderUsers();
  });
}
function loadPending(){
  return Promise.all([api('/api/admin/pro/orders'),api('/api/admin/payments')]).then(function(result){
    var rows=result[0].orders.map(function(o){
      return '<div class="row"><div class="who"><b>'+esc(o.email||'Akun #'+o.account_id)+'</b><span>Order '+esc(o.order_id)+' · '+esc(o.plan.name)+' · '+rp(o.amount)+' · '+date(o.created_at)+'</span><span class="tag">Dari dashboard</span></div><div class="acts"><button type="button" class="btn primary" data-order="'+esc(o.order_id)+'">Setujui</button></div></div>';
    }).concat(result[1].payments.map(function(p){
      return '<div class="row"><div class="who"><b>'+esc(p.email||'Telegram '+p.telegram_id)+'</b><span>'+esc(p.plan?p.plan.name:'Paket tidak dikenal')+' · transfer '+rp(p.amount)+' · bukti '+date(p.proof_at)+'</span><span class="tag">Dari bot Telegram</span></div><div class="acts"><button type="button" class="btn primary" data-pay="approve" data-id="'+p.id+'">Setujui</button><button type="button" class="btn danger" data-pay="reject" data-id="'+p.id+'">Tolak</button></div></div>';
    }));
    $('pending').removeAttribute('aria-busy');$('pending').innerHTML=rows.length?rows.join(''):'<div class="empty">Tidak ada pembayaran yang menunggu.</div>';
  });
}
function start(){
  $('login').hidden=true;$('app').hidden=false;$('logout').hidden=false;
  return Promise.all([loadPending(),loadUsers()]);
}
function replaceUser(updated){users=users.map(function(u){return u.id===updated.id?updated:u;});renderUsers();}

$('login').addEventListener('submit',function(e){
  e.preventDefault();secret=$('secret').value.trim();if(!secret)return;
  $('loginBtn').disabled=true;$('loginErr').hidden=true;
  start().then(function(){try{sessionStorage.setItem(KEY,secret);}catch(err){}})
    .catch(function(error){if(secret)signOut(error.message);})
    .then(function(){$('loginBtn').disabled=false;});
});
$('logout').addEventListener('click',function(){signOut('');});
$('refresh').addEventListener('click',function(){Promise.all([loadPending(),loadUsers()]).then(function(){toast('Data diperbarui.');}).catch(function(error){toast(error.message);});});
$('q').addEventListener('input',function(){clearTimeout(searchTimer);searchTimer=setTimeout(function(){loadUsers().catch(function(error){toast(error.message);});},300);});
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  var d=b.dataset,id=+d.id,job=null;
  if(d.grant){
    job=api('/api/admin/accounts/'+id+'/pro',{method:'POST',body:JSON.stringify({plan_id:d.grant})}).then(function(u){armed=null;replaceUser(u);toast('Pro aktif untuk '+(u.email||'akun #'+u.id)+' sampai '+date(u.ends_at)+'.');});
  }else if(d.revoke){
    id=+d.revoke;
    if(armed!==id){armed=id;renderUsers();return;}
    job=api('/api/admin/accounts/'+id+'/pro',{method:'DELETE'}).then(function(u){armed=null;replaceUser(u);toast('Pro dicabut dari '+(u.email||'akun #'+u.id)+'.');});
  }else if(d.order){
    job=api('/api/admin/pro/orders/'+encodeURIComponent(d.order)+'/activate',{method:'POST'}).then(function(){toast('Order disetujui, Pro aktif.');return Promise.all([loadPending(),loadUsers()]);});
  }else if(d.pay){
    job=api('/api/admin/payments/'+id+'/'+d.pay,{method:'POST'}).then(function(){toast(d.pay==='approve'?'Disetujui. Bot mengaktifkan Pro dan memberi tahu pengguna dalam sekitar satu menit.':'Pembayaran ditolak.');return loadPending();});
  }else return;
  b.disabled=true;
  job.catch(function(error){toast(error.message);b.disabled=false;});
});

if(secret)start().catch(function(error){if(secret)signOut(error.message);});
})();
</script>
</body>
</html>
