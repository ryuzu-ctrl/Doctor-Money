<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" type="image/png" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Doctor Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-shaped dark glass app. One scrolling screen, floating nav pill with a raised "+" button, bottom sheet for quick add. Full-bleed under 520px. */
:root{
  color-scheme:dark;
  --page:#050716;
  --sky:#0D3248; --mid:#0A1232; --deep:#170C3A;
  --fg:#EAF2FF; --muted:#A3B3CC; --faint:#71829E;
  --accent:#4FE3E6; --accent-ink:#04222A;
  --good:#6EE7A0; --warn:#FFC857; --bad:#FF7A8A;
  --line:rgba(255,255,255,.14); --line-soft:rgba(255,255,255,.08);
  --display:'Sora','Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;background:var(--page);color:var(--fg);font:400 14px/1.45 var(--body);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(620px 420px at 82% 8%,rgba(79,227,230,.14),transparent 62%),radial-gradient(700px 520px at 8% 92%,rgba(124,92,255,.18),transparent 62%)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{position:relative;margin:auto;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0%,var(--mid) 46%,var(--deep) 100%);box-shadow:0 40px 90px rgba(0,0,10,.65),0 0 0 1px rgba(255,255,255,.04)}
.phone::before,.phone::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.phone::before{width:340px;height:340px;right:-150px;top:150px;background:radial-gradient(circle,rgba(79,227,230,.2),transparent 68%)}
.phone::after{width:380px;height:380px;left:-190px;bottom:60px;background:radial-gradient(circle,rgba(130,90,255,.24),transparent 68%)}
@media (min-width:521px){body{padding:16px}.phone{width:min(100%,420px);height:min(900px,100%);border-radius:46px;border:8px solid #0A0E22;outline:1px solid rgba(255,255,255,.14)}}
.screen{position:absolute;inset:0;z-index:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 132px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.stack{display:flex;flex-direction:column;gap:14px}

/* glass surfaces */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.105),rgba(255,255,255,.035));border:1px solid var(--line);border-radius:24px;-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 12px 32px rgba(0,0,12,.28)}
.sub{background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.pro-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid rgba(79,227,230,.3);border-radius:16px;background:rgba(79,227,230,.09);color:var(--fg);font-size:12.5px}
.pro-banner b{display:block;color:var(--accent);font:600 13px var(--display)}
.pro-banner button{border:0;background:none;color:var(--accent);font:600 12px var(--body);cursor:pointer;white-space:nowrap}
.pro-grid{display:grid;grid-template-columns:1fr;gap:10px}
.pro-plan{padding:15px;display:flex;flex-direction:column;gap:8px;border-color:var(--line)}
.pro-plan.selected,.pro-plan.featured{border-color:rgba(79,227,230,.55);background:linear-gradient(145deg,rgba(79,227,230,.13),rgba(255,255,255,.035))}
.pro-plan h2{margin:0;font:600 16px var(--display)}
.pro-plan .pro-price{font:700 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.pro-plan .pro-monthly,.pro-plan .pro-save{font-size:12px;color:var(--muted)}
.pro-plan .pro-save{color:var(--good)}
.pro-plan .btn{margin-top:4px}
.pro-order{padding:15px;display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
.pro-order h2{margin:0;font:600 16px var(--display)}
.pro-order b{color:var(--fg)}
.pro-note{font-size:12.5px;color:var(--muted)}
.lock{position:relative;overflow:hidden;padding:22px 18px 18px;display:flex;flex-direction:column;gap:14px;border-color:color-mix(in srgb,var(--c) 42%,transparent);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 20%,transparent),rgba(255,255,255,.035) 58%)}
.lock::before{content:"";position:absolute;width:260px;height:260px;right:-110px;top:-120px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 68%);pointer-events:none}
.lock>*{position:relative}
.lock-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lock-art{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);box-shadow:0 12px 30px color-mix(in srgb,var(--c) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.lock-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(255,200,87,.14);border:1px solid rgba(255,200,87,.4);color:var(--warn);font:600 11.5px var(--body)}
.lock h1{margin:2px 0 0;font:600 25px/1.18 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lock-lede{margin:0;font-size:14px;line-height:1.55;color:var(--fg);opacity:.88}
.lock-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.lock-list li{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;font-size:13.5px;line-height:1.4}
.lock-list .ic{flex:none;margin-top:1px;color:var(--good)}
.lock-price{display:flex;align-items:baseline;gap:7px;color:var(--muted);font-size:13px}
.lock-price b{font:700 24px/1 var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.lock .btn{height:50px;font-size:15px}
.lock-note{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* Doctor Money AI: floating robot and its panel */
.dmai{position:absolute;z-index:19;right:14px;bottom:98px;width:56px;height:56px;padding:0;border-radius:20px;border:1px solid rgba(79,227,230,.42);background:linear-gradient(160deg,rgba(44,66,110,.88),rgba(18,26,58,.94));color:var(--fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,12,.45),inset 0 1px 0 rgba(255,255,255,.18);animation:dmai-float 4.6s ease-in-out infinite;transition:opacity .2s,transform .2s}
.dmai::before{content:"";position:absolute;inset:-5px;border-radius:24px;border:1px solid rgba(79,227,230,.5);opacity:0;animation:dmai-glow 4.6s ease-in-out infinite;pointer-events:none}
.dmai.away{opacity:0;transform:scale(.6);pointer-events:none;animation:none}
.dmai-bot .dmai-eye{transform-box:fill-box;transform-origin:center;animation:dmai-blink 5.6s infinite}
.dmai-bot .dmai-tipdot{animation:dmai-beacon 2.8s ease-in-out infinite}
@keyframes dmai-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dmai-glow{0%,100%{opacity:0;transform:scale(.96)}50%{opacity:.55;transform:scale(1.04)}}
@keyframes dmai-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes dmai-beacon{0%,100%{opacity:1}50%{opacity:.35}}
.dmai-tip{position:absolute;z-index:19;right:78px;bottom:112px;padding:8px 12px;border-radius:14px 14px 4px 14px;background:rgba(18,28,62,.96);border:1px solid rgba(79,227,230,.35);font:600 12px var(--body);color:var(--fg);box-shadow:0 10px 24px rgba(0,0,12,.4);opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s;pointer-events:none}
.dmai-tip.show{opacity:1;transform:none}
.dmai-wrap{position:absolute;inset:0;z-index:35}
.dmai-catch{position:absolute;inset:0;background:rgba(3,6,20,.42);opacity:0;transition:opacity .2s}
.dmai-panel{position:absolute;left:14px;right:14px;bottom:98px;max-height:calc(100% - 122px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:16px;border-radius:26px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,rgba(26,40,82,.98),rgba(12,16,42,.99));border:1px solid rgba(79,227,230,.34);box-shadow:0 24px 60px rgba(0,0,12,.6),inset 0 1px 0 rgba(255,255,255,.14);transform-origin:calc(100% - 28px) 100%;transform:scale(.55) translateY(12px);opacity:0;transition:transform .24s cubic-bezier(.2,.9,.3,1.15),opacity .18s}
.dmai-panel::-webkit-scrollbar{display:none}
.dmai-wrap.open .dmai-catch{opacity:1}
.dmai-wrap.open .dmai-panel{transform:none;opacity:1}
.dmai-head{display:flex;align-items:center;gap:12px}
.dmai-ava{width:46px;height:46px;flex:none;border-radius:16px;display:grid;place-items:center;background:rgba(79,227,230,.1);border:1px solid rgba(79,227,230,.34)}
.dmai-head h2{margin:0;font:600 17px/1.2 var(--display)}
.dmai-head .eyebrow{display:block;margin-top:5px;color:var(--accent)}
.dmai-head .x{margin-left:auto}
.dmai-say{margin:0;padding:12px 14px;border-radius:6px 18px 18px 18px;background:rgba(79,227,230,.08);border:1px solid rgba(79,227,230,.2);font-size:14px;line-height:1.5}
.dmai-say b{display:block;font:600 15px var(--display);margin-bottom:3px}
.dmai-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dmai-act{position:relative;display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--fg);font:600 12.5px var(--body);text-align:left;cursor:pointer}
.dmai-act .ic{flex:none;color:var(--accent)}
.dmai-act i{margin-left:auto;padding:2px 5px;border-radius:6px;background:var(--warn);color:#2A1C00;font:700 8px/1 var(--body);font-style:normal;letter-spacing:.04em}
.dmai-meta{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.dmai-scan{position:relative;width:112px;height:112px;margin:6px auto 0;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(79,227,230,.16),transparent 70%);border:1px solid rgba(79,227,230,.3);overflow:hidden}
.dmai-scan::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px dashed rgba(79,227,230,.4);animation:dmai-spin 9s linear infinite}
.dmai-scan::after{content:"";position:absolute;left:0;right:0;height:26px;top:-26px;background:linear-gradient(180deg,transparent,rgba(79,227,230,.5));border-bottom:1.5px solid var(--accent);animation:dmai-sweep 1.9s ease-in-out infinite}
@keyframes dmai-spin{to{transform:rotate(360deg)}}
@keyframes dmai-sweep{0%{top:-26px}100%{top:112px}}
.dmai-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.dmai-steps li{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--faint)}
.dmai-steps li::before{content:"";width:9px;height:9px;flex:none;border-radius:50%;border:1.5px solid currentColor}
.dmai-steps li.on{color:var(--fg)}
.dmai-steps li.on::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,227,230,.2);animation:dmai-beacon 1s ease-in-out infinite}
.dmai-steps li.ok{color:var(--muted)}
.dmai-steps li.ok::before{background:var(--good);border-color:var(--good)}
.dmai-score{display:flex;align-items:center;gap:14px;padding:14px}
.dmai-score .ring text{font:700 24px var(--display);fill:var(--fg)}
.dmai-score b{display:block;font:700 19px/1.15 var(--display)}
.dmai-score span{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.dmai-sec{display:flex;flex-direction:column;gap:8px}
.dmai-sec ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.dmai-sec li{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;font-size:13px;line-height:1.45}
.dmai-sec li .ic{flex:none;margin-top:1px;color:var(--c,var(--accent))}
.dmai-sec li em{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:rgba(79,227,230,.16);color:var(--accent);font:700 11px var(--body);font-style:normal}
.dmai-panel p.dmai-text{margin:0;font-size:13.5px;line-height:1.55;color:var(--fg);opacity:.9}
.nav button.locked{position:relative}
.nav button.locked::after{content:"PRO";position:absolute;top:1px;left:50%;margin-left:5px;padding:1.5px 4px;border-radius:6px;background:var(--warn);color:#2A1C00;font:700 7px/1 var(--body);letter-spacing:.04em}
.pay-box{padding:14px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pay-row>span:first-child{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pay-row>span:last-child{display:flex;align-items:center;justify-content:flex-end;min-width:0}
.pay-row b{font:600 15px var(--display);text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.pay-row .pay-num{font-size:20px;letter-spacing:.03em;color:var(--accent)}
.pay-row .pay-code{font-size:13px}
.pay-copy{border:0;background:none;color:var(--accent);font:600 12px var(--body);cursor:pointer;padding:4px 0 4px 8px;white-space:nowrap}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel-h h2{margin:0;font:600 17px/1.2 var(--body)}
.aside{font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);font:600 12.5px var(--body);cursor:pointer;padding:6px 0}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.wm{font:600 16px var(--display);letter-spacing:-.01em}.wm b{color:var(--accent);font-weight:600}
.avatar{width:40px;height:40px;padding:0;overflow:hidden;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:linear-gradient(145deg,rgba(79,227,230,.35),rgba(124,92,255,.35));color:var(--fg);font:700 15px var(--display);cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:76px;height:76px;font-size:28px;cursor:default}
.hello{margin:18px 0 10px;font:600 26px/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance}
.nm{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;border-bottom:1px dashed rgba(79,227,230,.5)}
.name-in{width:9ch;min-width:7ch;background:rgba(255,255,255,.08);border:1px solid var(--accent);border-radius:10px;color:var(--accent);font:inherit;padding:0 8px}
.ttl{margin:18px 0 10px;font:600 26px/1.15 var(--display);letter-spacing:-.01em}
.month{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.month button{width:32px;height:32px;border-radius:50%;border:0;background:none;color:var(--fg);cursor:pointer;display:grid;place-items:center}
.month button:disabled{opacity:.3;cursor:default}
.month span{min-width:116px;text-align:center;font:600 13.5px var(--body)}
.ic{flex:none}

/* hero */
.hero{padding:18px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(150deg,rgba(79,227,230,.17),rgba(255,255,255,.05) 46%,rgba(124,140,255,.13))}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.bal{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font:700 30px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal .cur{font-size:15px;color:var(--muted);font-weight:600}
.eye{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.delta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 10px;border-radius:999px;font:600 12.5px var(--body);background:rgba(110,231,160,.12);color:var(--good)}
.delta.neg{background:rgba(255,122,138,.12);color:var(--bad)}
.score{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;text-align:center}
.score small{font:600 11.5px var(--body);color:var(--muted);max-width:76px;line-height:1.25}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io>div{display:flex;gap:9px;align-items:center;padding:10px;border-radius:16px;background:rgba(0,0,0,.2);border:1px solid var(--line-soft);min-width:0}
.io .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.io .in .ico{background:rgba(110,231,160,.14);color:var(--good)}
.io .out .ico{background:rgba(255,122,138,.14);color:var(--bad)}
.io div div{min-width:0}
.io span{display:block;font-size:11.5px;color:var(--muted)}
.io b{display:block;font:700 13.5px/1.25 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* tip */
.rx{display:flex;gap:12px;align-items:flex-start;padding:14px}
.rx-ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--accent);background:rgba(79,227,230,.12);border:1px solid rgba(79,227,230,.25)}
.rx p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:var(--fg)}

/* bills */
.bill{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px}
.bav{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:radial-gradient(circle at 30% 25%,rgba(79,227,230,.3),rgba(79,227,230,.08));border:1px solid rgba(79,227,230,.3)}
.bill-m{min-width:0}
.bill-m b{display:block;font:600 15px/1.25 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-m .l1{display:block;color:var(--muted);font-size:13px}
.bill-m .when{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:2px}
.bill-a{display:flex;flex-direction:column;gap:8px;width:106px}
.pill{height:34px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--accent);font:600 12.5px var(--body);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.pill:hover{background:rgba(79,227,230,.15)}
.pill.info{color:var(--muted);cursor:default}.pill.info:hover{background:rgba(255,255,255,.07)}
.pill.late{color:var(--bad);border-color:rgba(255,122,138,.4)}
.pill.soon{color:var(--warn)}
.done{display:flex;align-items:center;gap:10px;padding:14px;color:var(--good);font-weight:600}

/* health tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:112px}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--fg)}
.t-top .ic{color:var(--accent)}
.t-mid{display:flex;justify-content:space-between;align-items:center;gap:6px}
.t-val{font:700 24px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-val small{font:500 12.5px var(--body);color:var(--muted);margin-left:3px;letter-spacing:0}
.t-sub{font-size:12px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--body);margin-top:auto}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.good{color:var(--good)}.st.warn{color:var(--warn)}.st.bad{color:var(--bad)}.st.mute{color:var(--faint)}
.ring text{fill:var(--fg);font:700 12.5px var(--display)}
.ring{flex:none}
.diagnoses{display:flex;flex-direction:column;gap:10px}
.diagnosis{padding:13px;border-radius:17px;background:rgba(0,0,0,.16);border:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.diagnosis-head{display:flex;align-items:center;gap:8px;font-weight:700}
.diagnosis-head .ic{color:var(--accent)}
.diagnosis p{margin:0;font-size:12.5px;color:var(--muted)}
.diagnosis p b{color:var(--fg)}
.diagnosis .dx-action{color:var(--good)}
.dx-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dx-stat{padding:13px;border:1px solid var(--line-soft);border-radius:16px;background:rgba(0,0,0,.15);min-width:0}
.dx-stat span,.dx-stat small{display:block;color:var(--muted);font-size:11.5px}
.dx-stat b{display:block;margin:4px 0;font:700 18px/1.2 var(--display);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.dx-timeline{display:flex;flex-direction:column;gap:12px}
.dx-month{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px}
.dx-month-label{font-size:11.5px;color:var(--muted)}
.dx-bars{display:flex;flex-direction:column;gap:4px}
.dx-bars i{display:block;height:6px;max-width:100%;border-radius:99px}
.dx-bars .dx-income{background:var(--good)}.dx-bars .dx-expense{background:var(--bad)}
.dx-month-net{font-size:11.5px;font-weight:700;white-space:nowrap}
.dx-legend{display:flex;gap:14px;color:var(--muted);font-size:11.5px}
.dx-legend span{display:inline-flex;align-items:center;gap:5px}
.dx-legend i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.dx-legend .dx-expense-dot{background:var(--bad)}
.dx-projection{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.dx-projection>div{padding:10px 8px;border:1px solid var(--line-soft);border-radius:14px;background:rgba(0,0,0,.14);min-width:0}
.dx-projection span,.dx-projection small{display:block;color:var(--muted);font-size:10.5px}
.dx-projection b{display:block;margin:5px 0;font:700 13px var(--display);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.dx-action-control{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.dx-action-control label{font-size:12.5px;color:var(--muted)}
.dx-action-control output{color:var(--accent);font-weight:700}
.dx-action-control input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.dx-comparison{display:flex;flex-direction:column;gap:7px}
.dx-comparison>div{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:11.5px}
.dx-comparison b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dx-comparison .dx-improved{color:var(--good)}
.dx-note{font-size:11.5px;color:var(--faint)}
.money-flow{gap:14px;background:linear-gradient(145deg,rgba(79,227,230,.12),rgba(255,255,255,.035) 55%,rgba(124,92,255,.1))}
.flow-total{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:14px;border-radius:18px;background:rgba(0,0,0,.18);border:1px solid var(--line-soft)}
.flow-total span{display:block;font-size:12px;color:var(--muted)}
.flow-total b{display:block;margin-top:3px;font:700 23px/1.15 var(--display);font-variant-numeric:tabular-nums}
.flow-out{text-align:right}
.flow-list{display:flex;flex-direction:column;gap:12px}
.flow-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.flow-label{display:flex;align-items:center;gap:9px;min-width:0}
.flow-emoji{width:34px;height:34px;display:grid;place-items:center;border-radius:12px;background:color-mix(in srgb,var(--c) 15%,transparent);font-size:17px}
.flow-label b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.flow-label small{display:block;color:var(--muted);font-size:11.5px}
.flow-amount{text-align:right;font:600 13px var(--display);font-variant-numeric:tabular-nums}
.flow-bar{grid-column:1/-1;height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.flow-bar i{display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c))}
.flow-insight{padding:12px;border-radius:15px;background:rgba(79,227,230,.09);border:1px solid rgba(79,227,230,.17);font-size:12.5px;color:var(--muted)}
.flow-insight b{color:var(--fg)}
.flow-left{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-top:12px;border-top:1px solid var(--line-soft)}
.flow-left span{font-size:12.5px;color:var(--muted)}
.flow-left b{font:700 15px var(--display);font-variant-numeric:tabular-nums}
.flow-left.negative b{color:var(--bad)}

/* chart */
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.readout b{font:700 20px var(--display);font-variant-numeric:tabular-nums}
.readout span{font-size:12.5px;color:var(--muted)}
#c7{display:block;width:100%;height:auto;touch-action:pan-y;cursor:crosshair}
#c7 .gl{stroke:rgba(255,255,255,.08);stroke-width:1}
#c7 .ya,#c7 .xa{fill:var(--faint);font:500 10.5px var(--body)}
#c7 .xa.on{fill:var(--accent);font-weight:700}
#c7 .pd{fill:var(--accent);opacity:.55}
.chart-note{font-size:12px;color:var(--faint)}

/* bars & categories */
.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2FB8D6,var(--accent))}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:flex;flex-direction:column;gap:6px}
.cat-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px}
.cat-h span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.cat-h i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.cat-h b{font:600 13px var(--display);font-variant-numeric:tabular-nums}
.cat .bar i{background:var(--c)}

/* transactions */
.cic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 28%,transparent)}
.txs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tx{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.txs>.tx:first-child{border-top:0}
.tx-m{flex:1;min-width:0}
.tx-m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-m span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-r{display:flex;align-items:center;gap:4px;flex:none}
.amt{font:600 13.5px var(--display);font-variant-numeric:tabular-nums}
.amt.in{color:var(--good)}
.del{width:32px;height:32px;border-radius:10px;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.del:hover{color:var(--bad);background:rgba(255,122,138,.1)}
.day-h{display:flex;justify-content:space-between;padding:12px 0 2px;font:600 12px var(--body);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .field{padding-left:42px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font:500 13px var(--body);cursor:pointer}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--accent));color:var(--fg);background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent)}
.chip.sm{height:32px;font-size:12.5px}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum2>div{padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.sum2 b{font:700 15px var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* budgets, goals, wallets */
.brow{display:flex;flex-direction:column}
.brow-main{display:flex;flex-direction:column;gap:9px;width:100%;padding:12px;background:none;border:0;color:inherit;text-align:left;cursor:pointer;border-radius:18px}
.brow-top{display:flex;align-items:center;gap:12px}
.brow-top .m{flex:1;min-width:0}
.brow-top b{display:block;font-weight:600}
.brow-top .m span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.edit{display:flex;gap:8px;align-items:flex-end;padding:0 12px 12px}
.edit label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.edit>div{flex:1;min-width:0}
.big-num{font:700 28px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.goal{padding:14px;display:flex;flex-direction:column;gap:10px}
.g-top{display:flex;align-items:center;gap:12px}
.g-top .m{flex:1;min-width:0}.g-top b{display:block;font-weight:600}.g-top .m span{font-size:12.5px;color:var(--muted)}
.g-act{display:flex;gap:8px;flex-wrap:wrap}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:rgba(255,255,255,.06)}
.alloc i{display:block;min-width:4px}
.wcard .brow-main{gap:10px}
.w-bal{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.w-bal.neg{color:var(--bad)}
.w-io{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.w-io .i{color:var(--good)}.w-io .o{color:var(--bad)}
.foot{font-size:12px;color:var(--faint);text-align:center;padding:4px 12px}
.danger-zone{display:flex;flex-direction:column;gap:8px}

/* assets: crypto, saham, lainnya */
.hrow .m b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-val{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;text-align:right}
.h-val b{font:700 14px var(--display);font-variant-numeric:tabular-nums}
.pl{font:600 12px var(--body);font-variant-numeric:tabular-nums;color:var(--muted)}
.pl.up{color:var(--good)}.pl.dn{color:var(--bad)}
.rank{width:22px;text-align:center;color:var(--faint);font:600 12.5px var(--display);flex:none}
.legs{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legs span{display:inline-flex;align-items:center;gap:6px}
.legs i{width:8px;height:8px;border-radius:50%}
.nw{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-top:10px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.nw b{font:700 14.5px var(--display);color:var(--fg);font-variant-numeric:tabular-nums}
.aedit{flex-wrap:wrap}
.aedit>div{flex:1 1 40%}
.aedit .btn{flex:1}
.btn.dangerb{color:var(--bad);border-color:rgba(255,122,138,.4)}
.del.addb:hover{color:var(--accent);background:rgba(79,227,230,.12)}
.kseg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:14px;background:rgba(255,255,255,.06);gap:4px}
.kseg button{height:38px;border:0;border-radius:11px;background:none;color:var(--muted);font:600 13.5px var(--body);cursor:pointer}
.kseg button[aria-pressed="true"]{background:rgba(79,227,230,.16);color:var(--accent)}

/* buttons, fields */
.btn{height:46px;padding:0 20px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--fg);font:600 14.5px var(--body);cursor:pointer}
.btn.primary{background:linear-gradient(145deg,#7CF3F5,#2FB8D6);color:var(--accent-ink);border-color:transparent;box-shadow:0 8px 22px rgba(79,227,230,.28)}
.btn.sm{height:42px;padding:0 16px}
.btn.warnb{border-color:rgba(255,200,87,.5);color:var(--warn)}
.field{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);padding:0 14px;font:500 15px var(--body)}
.field.big{height:54px;font-size:17px}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field::placeholder{color:var(--faint)}
select.field option{background:#0f1633;color:var(--fg)}

/* nav */
.nav{position:absolute;z-index:20;left:14px;right:14px;bottom:14px;height:70px;border-radius:32px;display:grid;grid-template-columns:repeat(7,1fr);align-items:center;padding:0 6px;background:linear-gradient(160deg,rgba(44,66,110,.6),rgba(18,26,58,.78))}
.nav button{background:none;border:0;color:var(--faint);font:500 9px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;cursor:pointer;min-width:0;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] .ic{filter:drop-shadow(0 0 8px rgba(79,227,230,.7))}
.nav .fab{width:50px;height:50px;border-radius:50%;margin:-25px auto 0;padding:0;justify-content:center;background:linear-gradient(145deg,#7CF3F5,#2FB8D6);color:var(--accent-ink);box-shadow:0 10px 26px rgba(79,227,230,.4),inset 0 1px 0 rgba(255,255,255,.55)}

/* sheet */
.sheet-wrap{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(3,6,20,.64);opacity:0;transition:opacity .2s}
.sheet{position:relative;width:100%;max-height:94%;overflow:auto;padding:10px 18px 22px;border-radius:30px 30px 0 0;background:linear-gradient(180deg,rgba(26,40,82,.97),rgba(12,16,42,.99));border:1px solid var(--line);border-bottom:0;transform:translateY(28px);opacity:0;transition:transform .24s ease,opacity .2s;display:flex;flex-direction:column;gap:12px}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none;opacity:1}
.grab{width:42px;height:4px;border-radius:9px;background:rgba(255,255,255,.22);margin:0 auto 2px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet-head h2{margin:6px 0 0;font:600 20px var(--display)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.lbl{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
.preview{min-height:62px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.22);border:1px dashed var(--line);display:flex;flex-direction:column;gap:2px;justify-content:center}
.pv-amt{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.pv-amt.in{color:var(--good)}
.pv-meta,.pv-hint{color:var(--muted);font-size:12.5px}
.pv-err{color:var(--bad);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);gap:4px}
.seg button{height:38px;border:0;border-radius:11px;background:none;color:var(--muted);font:600 13.5px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(255,122,138,.16);color:var(--bad)}
.seg button[data-arg="in"][aria-pressed="true"]{background:rgba(110,231,160,.16);color:var(--good)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>div{min-width:0}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:4px}
.acct-head{display:flex;align-items:center;gap:14px}
.acct-head .stack{gap:2px;align-items:flex-start}
.acct-sec{margin:8px 0 0;font:600 15px var(--display)}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex:none}
.kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}

/* toast */
.toast{position:absolute;z-index:60;left:16px;right:16px;bottom:100px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(18,28,62,.94);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,12,.5);font-size:13px}
.toast button{background:none;border:0;color:var(--accent);font:700 13px var(--body);cursor:pointer;padding:4px 2px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF3F5"/><stop offset="1" stop-color="#2FB8D6"/></linearGradient>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF3F5"/><stop offset="1" stop-color="#2FB8D6"/></linearGradient>
  <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FE3E6" stop-opacity=".42"/><stop offset="1" stop-color="#4FE3E6" stop-opacity="0"/></linearGradient>
</defs></svg>

<main class="phone" id="phone">
  <div class="screen" id="screen"><div class="stack" id="view"></div></div>

  <nav class="nav glass" aria-label="Navigasi utama">
    <button type="button" data-act="tab" data-arg="home"></button>
    <button type="button" data-act="tab" data-arg="tx"></button>
    <button type="button" data-act="tab" data-arg="diagnose"></button>
    <button type="button" class="fab" data-act="add" aria-label="Tambah transaksi" id="fab"></button>
    <button type="button" data-act="tab" data-arg="bud"></button>
    <button type="button" data-act="tab" data-arg="aset"></button>
    <button type="button" data-act="tab" data-arg="wal"></button>
  </nav>

  <div class="sheet-wrap" id="sheet" hidden>
    <div class="backdrop" data-act="close"></div>
    <form class="sheet" id="addForm" autocomplete="off" aria-labelledby="sheet-title">
      <div class="grab"></div>
      <div class="sheet-head">
        <div><span class="eyebrow">Catat cepat</span><h2 id="sheet-title">Tambah transaksi</h2></div>

      </div>
      <div>
        <label class="lbl" for="qtext">Deskripsi dan nominal transaksi</label>

      </div>
      <div class="chips" aria-label="Contoh penulisan">
        <button type="button" class="chip sm" data-act="ex" data-arg="kopi 25.000">kopi 25.000</button>
        <button type="button" class="chip sm" data-act="ex" data-arg="beli buku 1,5jt">beli buku 1,5jt</button>
        <button type="button" class="chip sm" data-act="ex" data-arg="bensin 50rb">bensin 50rb</button>
        <button type="button" class="chip sm" data-act="ex" data-arg="gaji 9jt">gaji 9jt</button>
      </div>
      <div class="preview" id="preview" aria-live="polite"></div>
      <div class="seg" role="group" aria-label="Jenis transaksi">
        <button type="button" data-act="type" data-arg="out" aria-pressed="true">Pengeluaran</button>
        <button type="button" data-act="type" data-arg="in" aria-pressed="false">Pemasukan</button>
      </div>
      <div class="row2">
        <div><label class="lbl" for="qwallet">Dompet</label><select class="field" id="qwallet"></select></div>
        <div><label class="lbl" for="qdate">Tanggal</label><input class="field" id="qdate" type="date"></div>
      </div>
      <div><span class="lbl">Kategori</span><div class="chips" id="catChips"></div></div>
      <div class="actions">
        <button type="button" class="btn" data-act="close">Batal</button>
        <button type="submit" class="btn primary">Simpan</button>
      </div>
    </form>
  </div>

  <div class="sheet-wrap" id="asheet" hidden>
    <div class="backdrop" data-act="aclose"></div>
    <form class="sheet" id="assetForm" autocomplete="off" aria-labelledby="asheet-title">
      <div class="grab"></div>
      <div class="sheet-head">
        <div><span class="eyebrow">Aset &amp; investasi</span><h2 id="asheet-title">Catat aset</h2></div>
        <button type="button" class="x" data-act="aclose" aria-label="Tutup" id="axbtn"></button>
      </div>
      <div class="kseg" role="group" aria-label="Jenis aset">
        <button type="button" data-act="akind" data-arg="crypto" aria-pressed="true">Crypto</button>
        <button type="button" data-act="akind" data-arg="stock" aria-pressed="false">Saham</button>
        <button type="button" data-act="akind" data-arg="other" aria-pressed="false">Lainnya</button>

  var mult=/^(juta|jt)$/.test(unit)?1e6:/^(ribu|rb|k)$/.test(unit)?1e3:1;
  var grouped=/^\d{1,3}([.,]\d{3})+$/.test(raw);

function mergeState(base,local,remote){var merged=Object.assign({},remote);merged.txs=mergeList(base.txs,local.txs,remote.txs,'id');merged.wallets=mergeList(base.wallets,local.wallets,remote.wallets,'id');merged.goals=mergeList(base.goals,local.goals,remote.goals,'id');merged.portfolio=mergeList(base.portfolio,local.portfolio,remote.portfolio,'id');merged.budgets=mergeMap(base.budgets,local.budgets,remote.budgets);if(local.name!==base.name)merged.name=local.name;if(JSON.stringify(local.preferences)!==JSON.stringify(base.preferences))merged.preferences=local.preferences;return merged;}

/* ---------- calculations ---------- */
function inM(ym){return S.txs.filter(function(t){return t.date.slice(0,7)===ym;});}
function isExp(t){return t.type==='out'&&!t.sv;}
function sumIn(l){return l.filter(function(t){return t.type==='in'&&!t.sv;}).reduce(function(a,t){return a+t.amt;},0);}
function sumOut(l){return l.filter(isExp).reduce(function(a,t){return a+t.amt;},0);}
function bal(w){return w.start+S.txs.filter(function(t){return t.w===w.id;}).reduce(function(a,t){return a+(t.type==='in'?t.amt:-t.amt);},0);}
function stats(ym){
  var l=inM(ym),inc=sumIn(l),exp=sumOut(l),byCat={};
  l.forEach(function(t){if(isExp(t))byCat[t.cat]=(byCat[t.cat]||0)+t.amt;});
  var bTot=0,bSpent=0;
  Object.keys(S.budgets).forEach(function(k){bTot+=S.budgets[k];bSpent+=byCat[k]||0;});
  var net=inc-exp,sr=inc>0?net/inc:null,tag=byCat.tagihan||0;
  var base=sumOut(inM(shiftYM(ym,-1)));if(!base)base=exp;
  var sw=S.wallets.filter(function(w){return w.id==='sav';})[0];
  var sav=sw?bal(sw):0,em=base>0?sav/base:null;
  return {l:l,inc:inc,exp:exp,net:net,sr:sr,byCat:byCat,bTot:bTot,bSpent:bSpent,used:bTot?bSpent/bTot:0,loadR:inc>0?tag/inc:null,em:em};
}
function score(st){
  if(!st.l.length)return null;
  var p1=clamp((st.sr==null?0:st.sr)/0.3,0,1)*40;
  var p2_=st.bTot>0?(st.used<=1?30:Math.max(0,30*(1-(st.used-1)*2))):15;
  var p3=clamp((st.em||0)/6,0,1)*30;
  return Math.round(p1+p2_+p3);
}
function scoreLabel(s){return s==null?'Belum ada data':s>=80?'Prima':s>=60?'Sehat':s>=40?'Perlu perhatian':'Kritis';}
function periodDayLimit(ym){return ym===curYM()?new Date().getDate():new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();}
function periodTransactions(ym,dayLimit){
  return inM(ym).filter(function(t){return Number(t.date.slice(8,10))<=dayLimit;});
}
function categoryTotals(list){
  var result={};
  list.forEach(function(t){if(isExp(t))result[t.cat]=(result[t.cat]||0)+t.amt;});
  return result;
}
function daysInYM(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();}
function healthBreakdown(st){
  var savings=clamp((st.sr==null?0:st.sr)/.3,0,1)*40;
  var budget=st.bTot>0?(st.used<=1?30:Math.max(0,30*(1-(st.used-1)*2))):15;
  var emergency=clamp((st.em||0)/6,0,1)*30;
  return {savings:Math.round(savings),budget:Math.round(budget),emergency:Math.round(emergency)};
}
var diagnoseCutPct=null;
function diagnoseData(){
  var currentMonth=curYM(),history=[],allTransactions=S.txs.length>0;
  for(var i=5;i>=0;i--){
    var month=shiftYM(currentMonth,-i),transactions=inM(month);
    history.push({month:month,transactions:transactions,income:sumIn(transactions),expense:sumOut(transactions),net:sumIn(transactions)-sumOut(transactions)});
  }
  var completed=history.filter(function(item){return item.month<currentMonth&&item.transactions.length>0;}).slice(-3);
  var forecastSource=completed.length?completed:history.filter(function(item){return item.month===currentMonth&&item.transactions.length>0;});
  var divisor=forecastSource.length||1,income=forecastSource.reduce(function(total,item){return total+item.income;},0)/divisor;
  var expense=forecastSource.reduce(function(total,item){return total+item.expense;},0)/divisor;
  var categoryTotalsByWindow={};
  forecastSource.forEach(function(item){
    var totals=categoryTotals(item.transactions);
    Object.keys(totals).forEach(function(key){categoryTotalsByWindow[key]=(categoryTotalsByWindow[key]||0)+totals[key]/divisor;});
  });
  var categoryKeys=Object.keys(categoryTotalsByWindow).sort(function(a,b){return categoryTotalsByWindow[b]-categoryTotalsByWindow[a];});
  var topCategory=categoryKeys[0]||'',topCategoryAmount=topCategory?categoryTotalsByWindow[topCategory]:0;
  var cash=S.wallets.reduce(function(total,w){return total+bal(w);},0),net=income-expense;
  var present=stats(currentMonth),presentScore=score(present),savingsRate=income>0?net/income:null;
  var runway=expense>0?cash/expense:null,cutCategory=topCategory?(CAT[topCategory]||CAT.lain).n:'pengeluaran fleksibel';
  if(diagnoseCutPct===null)diagnoseCutPct=net<0?15:10;
  return {history:history,hasTransactions:allTransactions,sourceCount:forecastSource.length,usedPartial:completed.length===0&&forecastSource.length>0,income:income,expense:expense,net:net,cash:cash,present:present,presentScore:presentScore,savingsRate:savingsRate,runway:runway,topCategory:topCategory,topCategoryAmount:topCategoryAmount,categoryShare:expense>0?topCategoryAmount/expense:0,cutCategory:cutCategory};
}
function signedRp(value){return (value<0?'−':'')+rp(Math.abs(value));}
function diagnoseFindings(data){
  var findings=[];
  if(!data.hasTransactions)return [{title:'Belum ada riwayat transaksi',body:'Diagnose belum bisa membaca pola pemasukan dan pengeluaran. Catat transaksi agar analisis dan proyeksi berdasarkan data Anda.',action:'Mulai dengan mencatat pemasukan dan pengeluaran rutin.'}];
  if(data.income<=0&&data.expense>0)findings.push({title:'Pemasukan belum tercatat',body:'Pengeluaran bulanan yang tercatat sekitar '+rp(data.expense)+', tetapi belum ada pemasukan pada periode pembanding. Saldo bisa terus terpakai jika pola ini berlanjut.',action:'Catat pemasukan rutin agar perkiraan arus kas tidak menganggap pemasukan selalu nol.'});
  else if(data.net<0)findings.push({title:'Arus kas bulanan defisit',body:'Rata-rata pengeluaran tercatat melebihi pemasukan sekitar '+rp(-data.net)+' per bulan. Selisih ini mengurangi saldo sebesar itu setiap bulan jika pola berlanjut.',action:'Kurangi pengeluaran rutin atau tambah pemasukan setidaknya '+rp(-data.net)+' per bulan untuk mencapai titik impas.'});
  else if(data.income>0)findings.push({title:'Arus kas bulanan positif',body:'Rata-rata masih menyisakan sekitar '+rp(data.net)+' per bulan setelah pengeluaran tercatat. Pertahankan surplus ini agar saldo dan dana darurat bertumbuh.',action:'Sisihkan surplus segera setelah pemasukan diterima.'});
  if(data.categoryShare>=.35)findings.push({title:'Pengeluaran terkonsentrasi di '+data.cutCategory,body:'Kategori ini menyerap sekitar '+Math.round(data.categoryShare*100)+'% dari pengeluaran rata-rata ('+rp(data.topCategoryAmount)+' per bulan). Konsentrasi tinggi membuat anggaran lebih rentan bila biaya kategori ini naik.',action:'Tinjau transaksi terbesar di kategori ini; uji pengurangan bertahap sebelum mengubah kebutuhan pokok.'});

function diagnosisHTML(st,sc){
  var cards=[],dayLimit=periodDayLimit(S.ym),previousYM=shiftYM(S.ym,-1);
  var comparisonDay=Math.min(dayLimit,daysInYM(previousYM));
  var currentByCat=categoryTotals(periodTransactions(S.ym,comparisonDay));

  var trend=Object.keys(currentByCat).map(function(k){
    var current=currentByCat[k],previous=previousByCat[k]||0;
    return {key:k,current:current,previous:previous,delta:current-previous,pct:previous>0?(current-previous)/previous:null};
  }).filter(function(x){return x.delta>0&&x.key!=='tabungan';}).sort(function(a,b){return b.delta-a.delta;})[0];
  if(trend&&(trend.pct==null||trend.pct>=.1)){
    var category=CAT[trend.key]||CAT.lain,budget=S.budgets[trend.key]||0,spent=trend.current;
    var change=trend.pct==null?'mulai tercatat sebesar '+rp(trend.current):'naik '+Math.round(trend.pct*100)+'% (bertambah '+rp(trend.delta)+')';
    var action=budget>0?(spent>=budget?'Anggaran '+category.n+' sudah terpakai. Tunda belanja non-esensial di kategori ini sampai periode berikutnya.':'Sisa anggaran '+category.n+' '+rp(budget-spent)+'. Batasi pengeluaran berikutnya sekitar '+rp((budget-spent)/Math.max(1,daysInYM(S.ym)-dayLimit+1))+' per hari.'):'Periksa transaksi '+category.n+' terbaru, lalu tetapkan batas anggaran bulanan agar kenaikannya terkendali.';
    cards.push('<article class="diagnosis"><div class="diagnosis-head">'+ic(category.i,18)+'<span>Perubahan pengeluaran</span></div><p>'+esc(category.n)+' '+change+' dibanding periode setara bulan lalu ('+comparisonDay+' hari pertama). Nilainya kini '+rp(trend.current)+'.</p><p class="dx-action"><b>Yang bisa dilakukan:</b> '+esc(action)+'</p></article>');
  }

    var dailyBurn=currentDeficit/comparisonDay,previousBurn=previousDeficit/comparisonDay;
    var liquid=S.wallets.reduce(function(total,w){return total+bal(w);},0);
    if(liquid>0&&dailyBurn>0&&previousBurn>0){

  if(sc!=null){

    var next=st.sr==null||st.sr<.2?'Naikkan sisa pemasukan setelah pengeluaran; mulai dengan mengurangi kategori yang sedang meningkat.':st.bTot===0?'Atur batas untuk kategori pengeluaran terbesar agar perubahan bulan depan bisa dipantau.':st.used>1?'Kurangi pengeluaran pada anggaran yang terlampaui.':st.em!=null&&st.em<6?'Sisihkan sebagian surplus rutin untuk menambah dana darurat menuju target 6 bulan.':'Pertahankan rasio tabungan dan evaluasi anggaran tiap minggu.';
    cards.push('<article class="diagnosis"><div class="diagnosis-head">'+ic('pulse',18)+'<span>Kondisi keuangan: '+esc(scoreLabel(sc))+' '+sc+'/100</span></div><p>Skor dihitung dari rasio tabungan ('+drivers[0]+'), pemakaian anggaran ('+drivers[1]+'), dan dana darurat ('+drivers[2]+'). Ini menjelaskan faktor di balik skor, bukan penilaian kredit.</p><p class="dx-action"><b>Fokus berikutnya:</b> '+esc(next)+'</p></article>');
  }

  return '<section class="panel glass" aria-labelledby="h-diagnosis"><div class="panel-h"><h2 id="h-diagnosis">Diagnosis keuangan</h2><span class="aside">Pola bulan ini</span></div><div class="diagnoses">'+cards.join('')+'</div><span class="aside">Analisis otomatis berdasarkan transaksi dan anggaran tersimpan. Bukan nasihat keuangan profesional.</span></section>';
}

function parseNum(t){
  t=String(t).trim().replace(/\s/g,'').replace(/^rp\.?/i,'');
  if(!/^\d[\d.,]*$/.test(t))return null;
  var d=t.lastIndexOf('.'),c=t.lastIndexOf(',');
  if(d>-1&&c>-1)t=c>d?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  else if(c>-1)t=t.match(/,/g).length>1?t.replace(/,/g,''):t.replace(',','.');
  else if(d>-1&&/^[1-9]\d{0,2}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');
  var n=parseFloat(t);return isFinite(n)?n:null;
}
function parsePrice(t){t=String(t).trim();if(/(juta|jt|ribu|rb|k)$/i.test(t)){var p=parseAmount(t);return p?p.val:null;}return parseNum(t);}

function rpx(n){n=Math.abs(n);return n>=100?rp(n):'Rp '+n.toLocaleString('id-ID',{maximumFractionDigits:n<1?6:2});}
function pct(n){return (n<0?'−':'+')+Math.abs(n).toLocaleString('id-ID',{maximumFractionDigits:2})+'%';}

function hKind(h){return KIND[h.kind]?h.kind:'crypto';}
function coinId(h){return h.asset_id||M.ids[String(h.code).toLowerCase()]||null;}
function hCalc(h){
  var k=hKind(h),q=+h.quantity||0,buy=+h.purchase_price||0,price=null,cost=q*buy,ch=null;
  if(k==='crypto'){
    var c=M.prices[coinId(h)];
    if(c&&c.idr){price=c.idr;ch=c.ch;if(h.currency==='USD')cost=c.usd?cost*c.idr/c.usd:null;}
    else if(h.currency==='USD')cost=null;
  }else price=h.price!=null?+h.price:buy;
  var value=price==null?null:q*price;
  return {k:k,q:q,price:price,value:value,cost:cost,pl:value!=null&&cost!=null?value-cost:null,ch:ch};
}
function assetStats(){
  var out={value:0,cost:0,pl:0,by:{crypto:0,stock:0,other:0},n:(S.portfolio||[]).length,unknown:0};
  (S.portfolio||[]).forEach(function(h){
    var c=hCalc(h);
    if(c.value==null){out.unknown++;return;}
    out.value+=c.value;out.by[c.k]+=c.value;
    if(c.pl!=null){out.cost+=c.cost;out.pl+=c.pl;}
  });
  return out;
}
function cg(path){return fetch(CG+path,{headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw new Error('market');return r.json();});}
async function findCoin(q){
  var r=await cg('/search?query='+encodeURIComponent(q)),cs=r.coins||[],s=String(q).toLowerCase();
  var c=cs.filter(function(x){return String(x.symbol).toLowerCase()===s;})[0]||cs[0];
  return c?{id:c.id,sym:String(c.symbol).toUpperCase(),name:c.name}:null;
}
async function loadMarket(force){
  if(M.loading||(!force&&Date.now()<M.next))return;
  M.loading=true;
  try{
    var top=await cg('/coins/markets?vs_currency=idr&order=market_cap_desc&per_page=10&page=1&price_change_percentage=24h');
    M.top=top.map(function(c){return {id:c.id,sym:String(c.symbol).toUpperCase(),name:c.name,idr:c.current_price,ch:c.price_change_percentage_24h};});
    M.top.forEach(function(c){M.prices[c.id]=Object.assign(M.prices[c.id]||{},{idr:c.idr,ch:c.ch});var k=c.sym.toLowerCase();if(!M.ids[k])M.ids[k]=c.id;});
    var held=(S.portfolio||[]).filter(function(h){return hKind(h)==='crypto';}),look=0,ids=[];
    for(var i=0;i<held.length;i++){
      var key=String(held[i].code).toLowerCase();
      if(!held[i].asset_id&&!M.ids[key]&&look<3){look++;try{var found=await findCoin(held[i].code);if(found)M.ids[key]=found.id;}catch(e){}}
    }
    held.forEach(function(h){var id=coinId(h);if(id&&ids.indexOf(id)<0)ids.push(id);});
    if(ids.length){
      var pr=await cg('/simple/price?ids='+encodeURIComponent(ids.join(','))+'&vs_currencies=idr,usd&include_24hr_change=true');
      Object.keys(pr).forEach(function(id){M.prices[id]={idr:pr[id].idr,usd:pr[id].usd,ch:pr[id].idr_24h_change};});
    }
    M.at=Date.now();M.err=false;
    try{localStorage.setItem(MARKET_KEY,JSON.stringify({top:M.top,prices:M.prices,ids:M.ids,at:M.at}));}catch(e){}
  }catch(e){M.err=true;}
  M.loading=false;M.next=Date.now()+60000;
  if((S.tab==='aset'||S.tab==='home')&&!S.edit&&!S.editName)render();
}

/* ---------- small drawing helpers ---------- */
function smooth(pts,minY,maxY){
  if(pts.length<2)return '';
  var d='M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1),t=.18;
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2_=pts[i+1],p3=pts[i+2]||p2_;
    var c1y=clamp(p1[1]+(p2_[1]-p0[1])*t,minY,maxY),c2y=clamp(p2_[1]-(p3[1]-p1[1])*t,minY,maxY);
    var c1x=p1[0]+(p2_[0]-p0[0])*t,c2x=p2_[0]-(p3[0]-p1[0])*t;
    d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2_[0].toFixed(1)+','+p2_[1].toFixed(1);
  }
  return d;
}
function ring(pct,size,sw,label,color,aria){
  var r=(size-sw)/2,c=2*Math.PI*r,p=clamp(pct,0,100),h=size/2;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc(aria||label)+'">'+
    '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="'+sw+'"/>'+
    '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*p/100).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+h+' '+h+')"/>'+
    '<text x="'+h+'" y="'+h+'" text-anchor="middle" dominant-baseline="central">'+esc(label)+'</text></svg>';
}
function spark(vals){
  var w=88,h=38;
  if(vals.length<2)vals=[0,0];
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=mx-mn||1;
  var pts=vals.map(function(v,i){return [3+i*(w-6)/(vals.length-1),h-5-(v-mn)/rg*(h-10)];});
  var last=pts[pts.length-1];
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="flex:none"><path d="'+smooth(pts,2,h-2)+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.2" fill="var(--accent)"/></svg>';
}
function chartHTML(sel){
  var days=last7(),W=340,H=178,L=40,R=14,T=14,B=28,pw=W-L-R,ph=H-T-B;
  var max=Math.max.apply(null,[0].concat(days.map(function(d){return d.val;})));
  var steps=[10000,20000,25000,50000,100000,200000,250000,500000,1000000,2000000,5000000];
  var step=steps.filter(function(s){return max/s<=4;})[0]||10000000;
  var n=Math.max(2,Math.ceil(max/step)),ymax=n*step;
  function X(i){return L+i*pw/6;}function Y(v){return T+ph*(1-v/ymax);}
  var pts=days.map(function(d,i){return [X(i),Y(d.val)];});
  var line=smooth(pts,T,T+ph),area=line+'L'+X(6)+','+(T+ph)+'L'+X(0)+','+(T+ph)+'Z';
  var grid='',g;
  for(g=0;g<=n;g++){var y=Y(g*step);grid+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" class="gl"/><text x="'+(L-8)+'" y="'+y+'" class="ya" text-anchor="end" dominant-baseline="central">'+(g?short(g*step):'0')+'</text>';}
  var xl='',dots='';
  days.forEach(function(d,i){xl+='<text x="'+X(i)+'" y="'+(H-9)+'" text-anchor="middle" class="xa'+(i===sel?' on':'')+'">'+DS[d.d.getDay()]+'</text>';dots+='<circle cx="'+pts[i][0]+'" cy="'+pts[i][1]+'" r="2.6" class="pd"/>';});
  var s=pts[sel],sd=days[sel];
  var total=days.reduce(function(a,d){return a+d.val;},0);
  return '<div class="readout"><div><span>'+dayLabel(sd.k)+'</span><br><b>'+rp(sd.val)+'</b></div><span>Rata-rata '+rp(total/7)+'/hari</span></div>'+
   '<svg id="c7" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Grafik pengeluaran harian 7 hari terakhir, tanpa tagihan. Dipilih: '+dayLabel(sd.k)+', '+rp(sd.val)+'">'+
   grid+'<path d="'+area+'" fill="url(#cg)"/>'+
   '<line x1="'+s[0]+'" x2="'+s[0]+'" y1="'+T+'" y2="'+(T+ph)+'" stroke="rgba(79,227,230,.4)" stroke-dasharray="3 4"/>'+
   '<path d="'+line+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
   dots+'<circle cx="'+s[0]+'" cy="'+s[1]+'" r="9" fill="rgba(79,227,230,.2)"/><circle cx="'+s[0]+'" cy="'+s[1]+'" r="4.6" fill="var(--accent)" stroke="#0A1232" stroke-width="2"/>'+xl+'</svg>';
}

async function runAI(mode){
  if(!apiToken||!apiReady){AI.view=!apiToken?'guest':'offline';renderAI();return;}
  if(isFree()&&mode!=='full'){AI.view='upsell';renderAI();return;}
  var run=++AI.run,started=Date.now();
  AI.mode=mode;AI.view='scan';AI.step=0;renderAI();
  window.clearInterval(AI.timer);
  AI.timer=window.setInterval(function(){if(AI.step<AI_STEPS.length-1){AI.step++;if(AI.view==='scan')renderAI();}},850);
  var next;
  try{
    // The examination reads the account's saved data, so let pending saves land first.
    await syncQueue;
    var body=await apiRequest('/api/ai/analyze',{method:'POST',body:JSON.stringify({mode:mode,context:NAV[S.tab]?S.tab:''})});
    AI.status=Object.assign({},AI.status,body.usage);
    if(body.status==='no_data')next='nodata';else{AI.result=body;next='result';}
  }catch(error){
    if(error.status===402){next=isFree()&&mode==='full'?'limit':'upsell';}
    else{AI.note=error.message;next='error';}
  }
  // Keep the scan on screen long enough to read, even when the answer was instant.
  var wait=Math.max(0,AI_STEPS.length*850-(Date.now()-started));
  setTimeout(function(){if(run!==AI.run)return;window.clearInterval(AI.timer);AI.view=next;renderAI();},wait);
}

var toastT=null;
function toast(msg,label,fn){
  var el=$('#toast');el.hidden=false;
  el.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button type="button" id="toastBtn">'+esc(label)+'</button>':'');
  var b=$('#toastBtn');if(b)b.onclick=function(){el.hidden=true;clearTimeout(toastT);fn&&fn();};
  clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},label?5500:3200);
}

  toast('Dihapus: '+tx.desc,'Urungkan',function(){S.txs.splice(Math.min(i,S.txs.length),0,tx);persist();render();});
 },
 goal:function(g){
  var a=g.split(':'),goal=S.goals.filter(function(x){return x.id===a[0];})[0],amt=+a[1];if(!goal)return;
  var add=Math.min(amt,goal.t-goal.s);if(add<=0)return;
  var tx={id:uid(),date:ymd(new Date()),desc:'Tabungan: '+goal.n,cat:'tabungan',amt:add,w:S.wallets[0].id,type:'out',sv:true};
  goal.s+=add;S.txs.push(tx);persist();render();
  toast('Setor '+rp(add)+' ke '+goal.n,'Urungkan',function(){goal.s-=add;S.txs=S.txs.filter(function(t){return t.id!==tx.id;});persist();render();});
 },
 type:function(g){var sh=S.sheet;if(!sh)return;sh.type=g;sh.typeManual=true;sh.catManual=false;if(CAT[sh.cat].t!==g)sh.cat=g==='in'?'lain_in':'lain';
  if(g!==detectType($('#qtext').value)||true){var t=$('#qtext').value;if(t.trim()){var c=detectCat(t,g);if(CAT[c].t===g)sh.cat=c;}}updateSheet();},
 pickcat:function(g){if(!S.sheet)return;S.sheet.cat=g;S.sheet.catManual=true;updateSheet();},
 ex:function(g){$('#qtext').value=g;S.sheet.typeManual=false;S.sheet.catManual=false;updateSheet();$('#qtext').focus();},
 rsample:function(){
  if(apiReady){toast('Data contoh tidak tersedia pada akun tersinkron.');return;}
  if(S.armed!=='sample'){S.armed='sample';render();setTimeout(function(){if(S.armed==='sample'){S.armed=null;if(S.tab==='wal')render();}},4000);return;}
  var d=defaults();d.name=S.name;Object.assign(S,d,{armed:null,edit:null});persist();render();toast('Data contoh dipulihkan');
 },
 rempty:function(){
  if(S.armed!=='empty'){S.armed='empty';render();setTimeout(function(){if(S.armed==='empty'){S.armed=null;if(S.tab==='wal')render();}},4000);return;}
  S.txs=[];S.portfolio=[];S.wallets.forEach(function(w){w.start=0;});S.goals.forEach(function(g){g.s=0;});S.armed=null;S.edit=null;persist();render();
  toast('Semua data dikosongkan. Ketuk dompet untuk mengisi saldo awal.');
 }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  if(migration&&el.dataset.act!=='importLegacy'&&el.dataset.act!=='discardLegacy'&&el.dataset.act!=='useServerState'&&el.dataset.act!=='useLocalState'){toast('Pilih dahulu sumber data yang akan digunakan.');return;}
  var f=ACT[el.dataset.act];if(f)f(el.dataset.arg,el,e);
});
document.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(migration){toast('Pilih dahulu sumber data yang akan digunakan.');return;}
  if(f.dataset.form==='password-reset-request'){
    if(authBusy)return;
    resetEmail=$('#resetEmail').value.trim();
    var resetSubmit=f.querySelector('[type="submit"]');
    authBusy=true;resetSubmit.disabled=true;resetSubmit.textContent='Mengirim…';
    (async function(){
      try{
        var response=await fetch(API_BASE_URL+'/api/auth/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,method:resetMethod})});
        var result={};try{result=await response.json();}catch(error){}
        if(!response.ok)throw new Error(result.detail||'Tidak dapat mengirim kode verifikasi');
        authMessage=result.message||'Jika akun dan metode verifikasi tersedia, kode akan dikirim.';
        authMode='reset-confirm';render(false);
      }catch(error){authMessage=error.message||'Tidak dapat mengirim kode verifikasi';render(false);}
      finally{authBusy=false;}
    })();
    return;
  }
  if(f.dataset.form==='password-reset-confirm'){
    if(authBusy)return;
    var resetCode=$('#resetCode').value.trim(),newPassword=$('#resetNewPassword').value,confirmSubmit=f.querySelector('[type="submit"]');
    authBusy=true;confirmSubmit.disabled=true;confirmSubmit.textContent='Memproses…';
    (async function(){
      try{
        var response=await fetch(API_BASE_URL+'/api/auth/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,method:resetMethod,code:resetCode,new_password:newPassword})});
        var result={};try{result=await response.json();}catch(error){}
        if(!response.ok)throw new Error(result.detail||'Kode tidak valid atau kedaluwarsa');
        authMode='login';authMessage='Kata sandi berhasil diubah. Masuk kembali dengan kata sandi baru.';
      }catch(error){authMessage=error.message||'Tidak dapat mereset kata sandi';}
      finally{authBusy=false;render(false);}
    })();
    return;
  }
  if(f.dataset.form==='auth'){
    if(authBusy)return;
    var email=$('#authEmail').value.trim(),password=$('#authPassword').value,submit=f.querySelector('[type="submit"]');
    authBusy=true;submit.disabled=true;submit.textContent='Memproses…';
    (async function(){
      try{
        var result;
        if(authMode==='signup')result=await registerEmail(email,password);
        else{
          var response=await fetch(API_BASE_URL+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});
          result={};try{result=await response.json();}catch(error){}
          if(!response.ok)throw new Error(result.detail||'Tidak dapat masuk');
        }
        apiToken=result.token;accountEmail=result.email||'';localStorage.setItem(SESSION_KEY,apiToken);offlineMode=false;showAuth=false;localStorage.removeItem(OFFLINE_KEY);authMessage='';
        await boot();
      }catch(error){authMessage=error.message||'Autentikasi gagal';render(false);}
      finally{authBusy=false;}
    })();
    return;
  }
  if(f.dataset.form==='auth-upgrade'){
    var upgradeEmail=$('#upgradeEmail').value.trim(),upgradePassword=$('#upgradePassword').value,upgradeSubmit=f.querySelector('[type="submit"]');
    upgradeSubmit.disabled=true;
    registerEmail(upgradeEmail,upgradePassword).then(function(result){apiToken=result.token;localStorage.setItem(SESSION_KEY,apiToken);accountEmail=result.email||upgradeEmail;profile=null;render();toast('Login email berhasil ditambahkan.');}).catch(function(error){toast(error.message||'Tidak dapat menambahkan login email.');}).finally(function(){upgradeSubmit.disabled=false;});
    return;
  }
  if(f.dataset.form==='account-profile'){saveAccountProfile(f);return;}
  if(f.dataset.form==='account-password'){saveAccountPassword(f);return;}
  if(f.id==='addForm'){saveSheet();return;}
  if(f.id==='assetForm'){saveAsset();return;}
  if(f.dataset.form==='asset'){
    var h=(S.portfolio||[]).filter(function(x){return x.id===f.dataset.id;})[0];if(!h)return;
    var q=parseNum($('#edit-in').value),pe=$('#edit-price'),pr=pe?parsePrice(pe.value):null;
    if(!(q>0)||q>1e12||(pe&&(pr==null||pr<0||pr>1e15))){toast('Isi angka yang valid, misalnya 0,5 atau 9.250');return;}
    h.quantity=hKind(h)==='stock'?Math.round(q*100):q;
    if(pe){h.price=pr;h.price_at=ymd(new Date());}
    S.edit=null;persist();render();toast('Tersimpan');return;
  }
  if(f.dataset.form==='telegram-link'){apiRequest('/api/link',{method:'POST',body:JSON.stringify({code:$('#linkCode').value.trim()})}).then(function(){linkedTelegram=true;render();toast('Akun Telegram berhasil dihubungkan.');}).catch(function(error){toast(error.message);});return;}
  if(f.dataset.form){
    var p=parseAmount($('#edit-in').value);
    if(!p||p.val<0){toast('Isi angka yang valid, misalnya 1.800.000 atau 1,8jt');return;}
    if(f.dataset.form==='budget'){S.budgets[f.dataset.id]=p.val;}
    else{S.wallets.forEach(function(w){if(w.id===f.dataset.id)w.start=p.val;});}
    S.edit=null;persist();render();toast('Tersimpan');
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(AI.open)closeAI();
    else if(S.pay)closePay();
    else if(S.acct)closeAccount();
    else if(S.sheet)closeSheet();
    else if(S.asheet)closeAsset();
    else if(S.edit||S.editName){S.edit=null;S.editName=false;render();}
  }
  if(e.key==='Enter'&&e.target.id==='nameIn'){e.preventDefault();saveName();}
});
document.addEventListener('focusout',function(e){if(e.target.id==='nameIn')saveName();});
document.addEventListener('input',function(e){
  if(e.target.id==='qtext'){if(S.sheet){S.sheet.typeManual=S.sheet.typeManual;updateSheet();}}
  if(e.target.id==='q'){S.q=e.target.value;$('#txList').innerHTML=txListHTML();}
  if(e.target.id==='dxCut'){diagnoseCutPct=+e.target.value;updateDiagnoseScenario();}
  if(/^(acode|aqty|abuy|anow)$/.test(e.target.id))updateAsset();
  if(e.target.id==='acctEmail'&&profile)$('#acctEmailPwBox').hidden=e.target.value.trim().toLowerCase()===profile.email;
});
document.addEventListener('change',function(e){
  if(e.target.id==='qwallet'&&S.sheet){S.sheet.wallet=e.target.value;updateSheet();}
  if(e.target.id==='qdate'&&S.sheet){S.sheet.date=e.target.value;}
  if(e.target.id==='acctFile')pickAvatar(e.target.files&&e.target.files[0]);
});
function pickDay(e){
  var svg=e.target.closest&&e.target.closest('#c7');if(!svg)return;
  var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*340;
  var i=clamp(Math.round((x-40)/((340-40-14)/6)),0,6);
  if(i!==S.sel){S.sel=i;$('#chartBox').innerHTML=chartHTML(i);}
}
document.addEventListener('pointermove',pickDay);
document.addEventListener('pointerdown',pickDay);

window.setInterval(function(){if(S.tab==='aset'&&!document.hidden){loadMarket();loadYahooMarket();}},60000);

initNav();
setTimeout(function(){var t=$('#dmaiTip');if(AI.open||$('#dmai').hidden||S.sheet||S.asheet||S.acct||S.pay)return;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},4500);},3500);
$('#view').innerHTML='<div class="empty">Menghubungkan ke penyimpanan Doctor Money…</div>';
$('.nav').hidden=true;$('#fab').hidden=true;$('#dmai').hidden=true;
boot();
})();
</script>
