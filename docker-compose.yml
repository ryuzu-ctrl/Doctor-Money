services:
  api:
    build: .
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/doctor_money.db
    volumes:
      - doctor-money-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/doctor_money.db
    volumes:
      - doctor-money-data:/data
    depends_on:
      - api
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  doctor-money-data: